name: Release

# Publishing happens here, not on a developer machine: `npm version` only pushes
# the commit and the tag, and this workflow publishes the tag it sees. A failed
# publish can be re-run from the Actions UI without bumping the version again.
on:
  push:
    tags:
      - "v*"
  # A manual run is always a rehearsal: same steps, but the publish is a dry run,
  # so the pipeline can be checked without spending a version number. It does not
  # exercise the OIDC exchange — `npm publish --dry-run` never calls the registry.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing: npm exchanges this OIDC token for a
      # short-lived publish credential, so there is no NPM_TOKEN to rotate.
      # One-time setup on npmjs.com: package -> Settings -> Trusted Publisher ->
      # GitHub Actions, repository faustienf/easing-scroll, workflow release.yml.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with Node 22.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: pnpm run check-types

      - run: pnpm test

      # Also validates the publishable package: the build runs publint and
      # are-the-types-wrong. `npm publish` rebuilds via prepack.
      - run: pnpm run build

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish

      - name: Dry run — everything except the registry write
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run
